server:
  port: 9093

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:servidor}:3306/bd_inscripcion
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

empresa:
  ambiente: produccion

servicios:
  evento:
    url: ${EVENTO_URL:http://servidor:9092}
  asistente:
    url: ${ASISTENTE_URL:http://servidor:9091}
