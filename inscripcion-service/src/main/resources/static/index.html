<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f97316">
<title>Inscripciones · Gestión de Eventos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23f97316'/%3E%3Cpath d='M7 12h18v3a2 2 0 0 0 0 4v3H7v-3a2 2 0 0 0 0-4z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{--h1:#f97316;--h2:#ef4444;--h3:#fcd34d}
:root,:root[data-theme=light]{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e7ebf3;--soft:#f6f8fc;--ok:#15803d;--okb:#dcfce7;--warn:#b45309;--warnb:#fef3c7;--bad:#dc2626;--badb:#fee2e2;--gray:#475569;--grayb:#e8ecf3;--sh:0 1px 2px rgba(15,23,42,.04),0 10px 30px rgba(15,23,42,.07);--shh:0 2px 4px rgba(15,23,42,.05),0 22px 48px rgba(15,23,42,.16);--glass:rgba(255,255,255,.82)}
:root[data-theme=dark]{--bg:#0a0f1e;--card:#121a2f;--ink:#e8edfb;--mut:#92a0bf;--line:#212b47;--soft:#172039;--ok:#4ade80;--okb:#10341f;--warn:#fbbf24;--warnb:#382c0d;--bad:#f87171;--badb:#3a1616;--gray:#cbd5e1;--grayb:#222c46;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);--shh:0 2px 4px rgba(0,0,0,.4),0 22px 48px rgba(0,0,0,.55);--glass:rgba(18,26,47,.82)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
svg.i{flex:none;vertical-align:-3px}
/* ---------- barra superior ---------- */
.topbar{position:fixed;top:0;left:0;right:0;z-index:60;transition:background .3s,box-shadow .3s,backdrop-filter .3s}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;height:72px}
.topbar.sc{background:var(--glass);backdrop-filter:blur(14px) saturate(1.4);box-shadow:0 1px 0 var(--line),0 8px 24px rgba(15,23,42,.06)}
.topbar.sc .wrap{height:62px}.topbar .wrap{transition:height .3s}
.logo{display:flex;align-items:center;gap:11px;font-weight:800;font-size:18px;letter-spacing:-.2px;color:#fff;text-decoration:none}
.logo i{width:38px;height:38px;border-radius:12px;background:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.topbar.sc .logo{color:var(--ink)}.topbar.sc .logo i{background:linear-gradient(135deg,var(--h1),var(--h2))}.topbar.sc .logo i path{fill:#fff}
.right{display:flex;align-items:center;gap:10px}
nav{display:flex;gap:4px;background:rgba(255,255,255,.17);padding:5px;border-radius:99px;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.22)}
nav a{color:#fff;text-decoration:none;font-size:14px;font-weight:700;padding:8px 18px;border-radius:99px;transition:.2s}
nav a:hover{background:rgba(255,255,255,.2)}nav a.on{background:#fff;color:var(--h1);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.topbar.sc nav{background:var(--soft);border-color:var(--line)}.topbar.sc nav a{color:var(--mut)}.topbar.sc nav a:hover{background:var(--grayb)}
.topbar.sc nav a.on{background:linear-gradient(120deg,var(--h1),var(--h2));color:#fff}
.tg{width:42px;height:42px;padding:0;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.17);color:#fff;border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px)}
.tg:hover{transform:rotate(18deg)}.topbar.sc .tg{background:var(--soft);color:var(--ink);border-color:var(--line)}
/* ---------- hero ---------- */
.hero{position:relative;color:#fff;overflow:hidden;padding:128px 0 150px;background:linear-gradient(125deg,var(--h1) 0%,var(--h2) 100%)}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.26) 1.2px,transparent 1.4px);background-size:26px 26px;-webkit-mask-image:linear-gradient(to bottom,#000,transparent 80%);mask-image:linear-gradient(to bottom,#000,transparent 80%)}
.hero::after{content:"";position:absolute;left:-5%;right:-5%;bottom:-1px;height:70px;background:var(--bg);border-radius:50% 50% 0 0/100% 100% 0 0}
.blob{position:absolute;border-radius:50%;filter:blur(55px);animation:drift 16s ease-in-out infinite alternate}
.b1{width:380px;height:380px;background:var(--h3);opacity:.55;left:-120px;top:-140px}
.b2{width:320px;height:320px;background:#fff;opacity:.2;right:8%;bottom:-130px;animation-delay:-7s}
.b3{width:200px;height:200px;background:var(--h3);opacity:.35;right:-60px;top:40px;animation-delay:-3s}
@keyframes drift{to{transform:translate(50px,34px) scale(1.12)}}
.hero-in{position:relative;z-index:2;display:grid;grid-template-columns:1.05fr .95fr;gap:24px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);padding:6px 14px;border-radius:99px;font-size:12.5px;font-weight:700;letter-spacing:.04em;backdrop-filter:blur(6px)}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 4px rgba(74,222,128,.3);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(74,222,128,0)}}
.hero h1{margin:16px 0 10px;font-size:clamp(34px,5vw,54px);line-height:1.04;font-weight:800;letter-spacing:-1.2px}
.hero p{margin:0 0 26px;font-size:17px;opacity:.93;max-width:470px}
.cta{background:#fff;color:var(--h1);box-shadow:0 12px 28px rgba(0,0,0,.22);display:inline-flex;align-items:center;gap:8px;padding:13px 24px;font-size:15px}
.cta:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(0,0,0,.28)}
.hero img{width:100%;max-width:470px;justify-self:end;filter:drop-shadow(0 22px 34px rgba(0,0,0,.28));animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px) rotate(-1deg)}}
/* ---------- estadisticas ---------- */
.stats{position:relative;z-index:5;margin-top:-92px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh);animation:up .55s both;transition:.25s}
.stat:hover{transform:translateY(-4px);box-shadow:var(--shh)}
.si{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.stat b{display:block;font-size:30px;line-height:1;font-weight:800;letter-spacing:-.5px}.stat span{font-size:13px;color:var(--mut);font-weight:600}
.c0{--c:var(--h1)}.c1{--c:#16a34a}.c2{--c:#d97706}.c3{--c:#dc2626}
/* ---------- barra de herramientas ---------- */
.bar{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--sh);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;position:relative}.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut)}
.search input{padding-left:42px}
input,select{font:inherit;font-size:14.5px;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:13px;background:var(--soft);color:var(--ink);transition:.2s}
input:focus,select:focus{outline:0;border-color:var(--h1);box-shadow:0 0 0 4px color-mix(in srgb,var(--h1) 18%,transparent);background:var(--card)}
input:disabled,select:disabled{opacity:.6}
label.fl{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--mut);font-weight:700}.fl select{width:auto;max-width:280px}
button{font:inherit;cursor:pointer;border:0;border-radius:13px;padding:11px 20px;font-weight:700;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.pri{background:linear-gradient(120deg,var(--h1),var(--h2));color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--h1) 40%,transparent)}
.pri:hover{transform:translateY(-2px);filter:brightness(1.07)}.pri:active{transform:none}
.sec{background:var(--grayb);color:var(--ink)}.sec:hover{filter:brightness(.96)}
/* ---------- tarjetas ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:24px;margin:26px 0 56px}
.item{animation:up .55s both}@keyframes up{from{opacity:0;transform:translateY(18px)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;height:100%;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.card:hover{transform:translateY(-7px);box-shadow:var(--shh)}
.b{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:11.5px;font-weight:800;letter-spacing:.04em}
.b::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b.ok{background:var(--okb);color:var(--ok)}.b.warn{background:var(--warnb);color:var(--warn)}.b.bad{background:var(--badb);color:var(--bad)}.b.gray{background:var(--grayb);color:var(--gray)}
.st .b{box-shadow:0 4px 12px rgba(0,0,0,.18)}
.st{position:absolute;top:14px;right:14px;z-index:3}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;text-shadow:0 1px 2px rgba(0,0,0,.25);box-shadow:0 0 0 4px var(--card),0 8px 18px rgba(0,0,0,.2)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-top:1px solid var(--line);margin-top:auto;background:var(--soft)}
.foot small{color:var(--mut);font-weight:700;font-size:12px}
.ab{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sm{padding:7px 12px;font-size:12.5px;border-radius:10px;background:var(--card);color:var(--ink);border:1px solid var(--line);gap:6px}
.sm:hover{background:var(--grayb)}.sm.del{color:var(--bad)}.sm.del:hover{background:var(--badb);border-color:transparent}
.sm.warn{color:var(--warn)}.sm.warn:hover{background:var(--warnb);border-color:transparent}
/* asistente */
.bn{height:92px;position:relative;background:linear-gradient(120deg,var(--h1),var(--h2))}
.bn::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.3) 1.2px,transparent 1.4px);background-size:16px 16px}
.bn::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.16);right:-30px;top:-60px}
.pf{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:-42px;padding:0 18px;position:relative;z-index:2}
.pf h3{margin:12px 0 2px;font-size:19px;letter-spacing:-.2px}.pf small{color:var(--mut);font-weight:600}
.info{list-style:none;margin:16px 0 18px;padding:0 22px;display:grid;gap:9px}
.info li{display:flex;gap:11px;align-items:center;font-size:14px;color:var(--mut);word-break:break-all}
.info li span{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--h1) 12%,transparent);color:var(--h1);flex:none}
/* evento */
.cv{position:relative;height:178px;flex:none}.cv svg.cover{position:absolute;inset:0;width:100%;height:100%}
.chip{position:absolute;left:18px;bottom:-26px;z-index:3;background:var(--card);border-radius:16px;padding:8px 15px;text-align:center;box-shadow:0 10px 22px rgba(0,0,0,.2);min-width:58px}
.chip b{display:block;font-size:24px;line-height:1;font-weight:800;color:var(--h1)}.chip span{font-size:11px;font-weight:800;color:var(--mut);letter-spacing:.1em}
.bd{padding:38px 20px 18px}
.bd h3{margin:0 0 8px;font-size:19px;line-height:1.25;letter-spacing:-.3px}
.meta{display:flex;gap:9px;align-items:center;color:var(--mut);font-size:14px;margin:5px 0}.meta svg{color:var(--h1)}
.cap{margin-top:16px;font-size:13px;color:var(--mut);font-weight:700}
.cap .tp{display:flex;justify-content:space-between;align-items:center}.cap .tp b{color:var(--ink)}
.cap .t{height:10px;background:var(--grayb);border-radius:10px;margin-top:8px;overflow:hidden}
.cap .t i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#22c55e,#10b981);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.cap .t i.mid{background:linear-gradient(90deg,#f59e0b,#f97316)}.cap .t i.full{background:linear-gradient(90deg,#f97316,#dc2626)}
/* ticket */
.tk.off{filter:grayscale(.9);opacity:.78}
.tk-top{position:relative;height:150px;color:#fff;display:flex;align-items:flex-end;flex:none}
.tk-top svg.cover{position:absolute;inset:0;width:100%;height:100%}
.tk-top::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(5,10,25,.78),transparent 72%)}
.tk-txt{position:relative;z-index:2;padding:14px 20px}.tk-txt small{font-size:10.5px;letter-spacing:.16em;font-weight:800;opacity:.85}
.tk-txt h3{margin:2px 0 4px;font-size:18px;line-height:1.2;text-shadow:0 2px 8px rgba(0,0,0,.4)}.tk-txt p{margin:0;font-size:12.5px;opacity:.95;display:flex;gap:12px;flex-wrap:wrap}.tk-txt p span{display:inline-flex;gap:5px;align-items:center}
.tk-cut{position:relative;border-top:2px dashed var(--line);margin:0 18px}
.tk-cut i{position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 3px rgba(15,23,42,.18)}
.tk-cut i:first-child{left:-31px}.tk-cut i:last-child{right:-31px}
.tk-bot{padding:18px 20px 16px}
.who{display:flex;align-items:center;gap:13px}.who .av{width:50px;height:50px;font-size:17px}
.who b{display:block;font-size:15.5px;line-height:1.25}.who small{color:var(--mut);font-size:12.5px;font-weight:600}
.bc{height:30px;margin-top:16px;border-radius:3px;opacity:.7;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 5px,var(--ink) 5px 6px,transparent 6px 10px,var(--ink) 10px 13px,transparent 13px 15px,var(--ink) 15px 16px,transparent 16px 20px)}
/* esqueleto de carga */
.sk{height:330px;border-radius:24px;background:linear-gradient(100deg,var(--card) 30%,var(--soft) 50%,var(--card) 70%);background-size:300% 100%;animation:sh 1.3s infinite;border:1px solid var(--line)}
@keyframes sh{to{background-position:-100% 0}}
.empty{grid-column:1/-1;text-align:center;padding:50px 10px 30px;color:var(--mut)}
.empty svg.big{width:150px;height:auto;margin-bottom:10px}.empty b{display:block;color:var(--ink);font-size:21px;margin-bottom:4px}.empty button{margin-top:18px}
/* ventana emergente */
dialog{border:0;border-radius:26px;padding:0;width:min(580px,94vw);background:var(--card);color:var(--ink);box-shadow:0 40px 100px rgba(0,0,0,.5);overflow:hidden}
dialog[open]{animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}@keyframes pop{from{opacity:0;transform:scale(.92) translateY(14px)}}
dialog::backdrop{background:rgba(6,10,26,.6);backdrop-filter:blur(6px)}
.dh{position:relative;background:linear-gradient(120deg,var(--h1),var(--h2));color:#fff;padding:22px 26px;display:flex;justify-content:space-between;align-items:center;overflow:hidden}
.dh::after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.14);right:40px;top:-80px}
.dh h2{margin:0;font-size:20px;display:flex;gap:11px;align-items:center;position:relative;z-index:1}
.x{background:rgba(255,255,255,.22);color:#fff;border-radius:50%;width:36px;height:36px;padding:0;position:relative;z-index:1}.x:hover{background:rgba(255,255,255,.35)}
form{padding:22px 26px 26px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--mut);font-weight:700}
form label.w{grid-column:1/-1}.btns{grid-column:1/-1;display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
#toast{position:fixed;right:20px;bottom:20px;max-width:390px;padding:14px 18px;border-radius:16px;color:#fff;font-size:14px;font-weight:600;z-index:99;display:flex;gap:12px;align-items:flex-start;
box-shadow:0 16px 40px rgba(0,0,0,.35);transform:translateY(40px) scale(.96);opacity:0;pointer-events:none;transition:.3s cubic-bezier(.2,.9,.3,1.2)}
#toast.show{transform:none;opacity:1}#toast.ok{background:linear-gradient(120deg,#16a34a,#059669)}#toast.err{background:linear-gradient(120deg,#dc2626,#e11d48)}
#toast ul{margin:5px 0 0;padding-left:18px;font-weight:500}
footer{text-align:center;color:var(--mut);font-size:13px;padding:0 0 34px;font-weight:600}
@media(max-width:860px){.hero-in{grid-template-columns:1fr}.hero img{display:none}.hero{padding:112px 0 140px}nav a{padding:7px 12px;font-size:13px}.logo span{display:none}}
@media(max-width:600px){form{grid-template-columns:1fr}.topbar .wrap{height:64px}nav{padding:3px}.stats{grid-template-columns:1fr 1fr}.stat{padding:14px;gap:10px}.si{width:42px;height:42px;border-radius:13px}.stat b{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar" id="top"><div class="wrap">
  <a class="logo" href="/"><i><svg width="22" height="22" viewBox="0 0 32 32"><path d="M4 9h24v5a3 3 0 0 0 0 6v5H4v-5a3 3 0 0 0 0-6z" fill="#f97316"/></svg></i><span>Gestión de Eventos</span></a>
  <div class="right"><nav id="nav"></nav><button class="tg" id="tg" type="button" aria-label="Cambiar tema"></button></div>
</div></header>
<section class="hero">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="wrap hero-in">
    <div><span class="eyebrow"><i></i>Microservicio en línea · puerto 8083</span><h1>Inscripciones</h1><p>Cada entrada une a un asistente con un evento y cuida los cupos.</p>
      <button class="cta" id="cta" type="button"></button></div>
    <img src="img/hero.svg" alt="Ilustración de Inscripciones">
  </div>
</section>
<main class="wrap">
  <section class="stats" id="stats"></section>
  <div class="bar">
    <div class="search"><svg class="i" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar por nombre, estado, fecha..." aria-label="Buscar"></div>
    <label class="fl">Evento <select id="filtro"></select></label>
    <button class="pri" id="nuevo" type="button"></button>
  </div>
  <section class="grid" id="grid"></section>
</main>
<footer>Reyes Saravia, Jordan Arturo · Microservicios con Spring Boot y MySQL</footer>
<dialog id="dlg">
  <div class="dh"><h2><span id="sicon"></span><span id="dTitle"></span></h2><button class="x" id="cerrar" type="button" aria-label="Cerrar"></button></div>
  <form id="form"><span id="fields" style="display:contents"></span>
    <div class="btns"><button class="sec" id="cancelar" type="button">Cancelar</button><button class="pri" id="guardar" type="submit">Guardar</button></div>
  </form>
</dialog>
<div id="toast"></div>
<script>

const hoy = () => new Date().toISOString().slice(0, 10);
const CFG = {
  api: '/api/inscripciones', nuevo: 'Nueva inscripción', btn: 'Nueva inscripción', icon: 'ticket',
  fields: [
    {k:'idEvento', l:'Evento', t:'select', req:true, lockOnEdit:true, wide:true,
     src:{url:'http://localhost:8082/api/eventos', label:e => `${e.nombre} (cap. ${e.capacidad})`}},
    {k:'idAsistente', l:'Asistente', t:'select', req:true, lockOnEdit:true, wide:true,
     src:{url:'http://localhost:8081/api/asistentes', label:a => `${a.nombres} ${a.apellidos} · ${a.documento}`}},
    {k:'fecha', l:'Fecha de inscripción', t:'date', req:true},
    {k:'estado', l:'Estado', t:'select', opts:['CONFIRMADA','PENDIENTE','CANCELADA'], req:true}
  ],
  defaults: () => { el('fecha').value = hoy(); },
  filter: {field:'idEvento', param:'idEvento'},
  after: () => loadLookups(),
  text: r => { const e = S.look.idEvento?.[r.idEvento], a = S.look.idAsistente?.[r.idAsistente];
    return `${e?.nombre || ''} ${a ? a.nombres + ' ' + a.apellidos : ''} ${r.estado} ${r.fecha}`; },
  stats: rows => [{n:rows.length, l:'Inscripciones', i:'ticket'}, {n:rows.filter(r => r.estado === 'CONFIRMADA').length, l:'Confirmadas', i:'check'},

const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(el, n) {
  if (reduced() || n < 2) { el.textContent = n; return; }
  let s = null; const d = 800;
  const f = t => { s ??= t; const p = Math.min(1, (t - s) / d); el.textContent = Math.round(n * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}
function confetti() {
  if (reduced()) return;
  const c = document.createElement('canvas'); c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:200';
  c.width = innerWidth; c.height = innerHeight; document.body.append(c);
  const x = c.getContext('2d'), cols = ['#f97316','#2563eb','#10b981','#f43f5e','#facc15','#06b6d4'];
  const P = Array.from({length: 110}, () => ({x: innerWidth / 2, y: innerHeight * .6, vx: (Math.random() - .5) * 18, vy: -Math.random() * 17 - 4, w: 6 + Math.random() * 6, h: 4 + Math.random() * 5, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[Math.random() * cols.length | 0]}));
  let f = 0; (function t() { x.clearRect(0, 0, c.width, c.height);
    P.forEach(p => { p.vy += .5; p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore(); });
    if (++f < 100) requestAnimationFrame(t); else c.remove(); })();
}

async function api(method, url, body) {

  catch (e) { throw {msg: 'No se pudo conectar con ' + url + '. ¿Está encendido el servicio?'}; }
  const t = await r.text(); let d = null; try { d = t ? JSON.parse(t) : null; } catch (e) {}
  if (!r.ok) throw {status: r.status, data: d, msg: d && d.mensaje || ('Error HTTP ' + r.status)};
  return d;
}

  for (const f of CFG.fields.filter(f => f.src)) {
    const sel = el(f.k);
    try {
      const data = await api('GET', f.src.url), keep = sel.value;
      S.look[f.k] = Object.fromEntries(data.map(x => [x.id, x]));
      sel.innerHTML = data.length ? data.map(x => `<option value="${x.id}">${esc(f.src.label(x))}</option>`).join('') : '<option value="">(no hay registros)</option>';
      if (keep) sel.value = keep;
    } catch (e) { S.look[f.k] = {}; sel.innerHTML = '<option value="">(servicio apagado)</option>'; }
  }
  if (CFG.filter) {
    const f = CFG.fields.find(x => x.k === CFG.filter.field);
    $('#filtro').innerHTML = '<option value="">Todos los eventos</option>' + Object.values(S.look[f.k] || {}).map(x => `<option value="${x.id}">${esc(f.src.label(x))}</option>`).join('');

/* ---------- arranque ---------- */
function setTheme(t) { root.dataset.theme = t; try { localStorage.setItem('tema', t); } catch (e) {} $('#tg').innerHTML = ic(t === 'dark' ? 'sun' : 'moon', 19); }
let saved = null; try { saved = localStorage.getItem('tema'); } catch (e) {}
setTheme(saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('#tg').onclick = () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
addEventListener('scroll', () => $('#top').classList.toggle('sc', scrollY > 24), {passive: true});

$('#form').addEventListener('submit', async ev => {
  ev.preventDefault();
  try {
    const nuevo = !S.editId;
    if (S.editId) { await api('PUT', `${CFG.api}/${S.editId}`, leer()); toast('Actualizado correctamente'); }
    else { await api('POST', CFG.api, leer()); toast('Registrado correctamente'); }
    $('#dlg').close(); if (nuevo) confetti(); await cargar(); if (CFG.after) CFG.after();
  } catch (e) { showError(e); }
});
$('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) $('#dlg').close(); });
$('#nuevo').onclick = $('#cta').onclick = abrir; $('#cerrar').onclick = $('#cancelar').onclick = () => $('#dlg').close();
$('#q').oninput = e => { S.q = e.target.value; render(); };
if (CFG.filter) $('#filtro').onchange = cargar;
$('#nav').innerHTML = [[8081,'Asistentes'],[8082,'Eventos'],[8083,'Inscripciones']]
  .map(([p, n]) => `<a href="http://localhost:${p}/" class="${location.port == p ? 'on' : ''}">${n}</a>`).join('');
$('#nuevo').innerHTML = ic('plus', 18) + CFG.btn; $('#cta').innerHTML = ic('plus', 18) + CFG.btn;
$('#sicon').innerHTML = ic(CFG.icon, 22); $('#grid').innerHTML = '<div class="sk"></div>'.repeat(3);
buildForm(); limpiar(); loadLookups().then(cargar);

document.querySelector('#cerrar').innerHTML = ic('x', 18);
</script>
</body>
</html>
